[package]
name = "ason-format-wasm"
version = "1.5.0"
edition = "2024"
description = "WebAssembly bindings for the ASON formatter and syntax highlighter"
license-file = "LICENSE.additional"
repository = "https://github.com/hemashushu/ason-formatter"
documentation = "https://github.com/hemashushu/ason-formatter#3-the-webassembly-package"
keywords = ["ason", "wasm", "formatter", "syntax-highlighting", "webassembly"]
categories = ["wasm"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ason-format = { path = "../ason-format" , version = "1.5.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.130"